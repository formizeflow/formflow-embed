name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build --if-present
      - run: npm pack
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "*.tgz" }
      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" *.tgz --generate-notes --verify-tag
        env: { GH_TOKEN: "${{ github.token }}" }
      # Org variable NPM_PUBLISH=true turns this on. Auth is npm trusted publishing (OIDC) when the package has this repo as
      # its trusted publisher, else the org secret NPM_TOKEN. Either way the provenance comes from this run's OIDC token.
      - name: Publish to npm with provenance
        if: vars.NPM_PUBLISH == 'true'
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
        run: |
          npm install -g npm@11
          name=$(node -p 'require("./package.json").name'); version=$(node -p 'require("./package.json").version')
          if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already on npm"; exit 0; fi
          npm publish ./*.tgz --provenance --access public
